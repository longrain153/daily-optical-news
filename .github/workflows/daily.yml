name: 光通信每日简报

on:
  schedule:
    # 北京时间约 07:33 = UTC 23:33（前一天）。每天运行。
    # 用非整点(:33)避开 GitHub 定时整点拥堵的延迟/跳过。
    - cron: "33 23 * * *"
  workflow_dispatch:

concurrency:
  group: daily-optical-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Install Chromium for screenshots
        run: python -m playwright install --with-deps chromium
      - name: Run daily brief
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PAGES_BASE: https://longrain153.github.io/daily-optical-news
        run: python main.py

      - name: Publish to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "brief: publish $(date -u +%Y-%m-%d)"
            git push
          fi
